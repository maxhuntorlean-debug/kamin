<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f4" />
    <meta name="robots" content="noindex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kamin" />
    <title>Kamin</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div class="brand">
          <img class="mark" src="/icons/icon-192.png" alt="" width="44" height="44" />
          <div>
            <h1>Kamin</h1>
            <p id="subtitle">Норвежский → русский</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="settings-open" class="gear" type="button" aria-expanded="false" aria-controls="settings">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor" d="M19.4 13.5a7.4 7.4 0 0 0 .05-1.5 7.4 7.4 0 0 0-.05-1.5l2.02-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.3 7.3 0 0 0-1.3-.75l-.36-2.54a.5.5 0 0 0-.5-.41h-3.84a.5.5 0 0 0-.5.41l-.36 2.54c-.46.2-.9.45-1.3.75l-2.39-.96a.5.5 0 0 0-.6.22L2.46 8.28a.5.5 0 0 0 .12.64L4.6 10.5a7.4 7.4 0 0 0 0 3l-2.02 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.4.3.84.55 1.3.75l.36 2.54a.5.5 0 0 0 .5.41h3.84a.5.5 0 0 0 .5-.41l.36-2.54c.46-.2.9-.45 1.3-.75l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64L19.4 13.5ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/>
            </svg>
            <span class="sr">Настройки</span>
          </button>
          <p id="pill" class="pill">
            <span class="dot" aria-hidden="true"></span>
            <span id="pill-text">Не слушаю</span>
          </p>
        </div>
      </header>

      <p id="status" class="banner error" role="alert" hidden></p>

      <div class="board">
        <section class="card now" aria-labelledby="now-title">
          <h2 id="now-title">Сейчас</h2>
          <p id="current" class="current placeholder" aria-live="polite">Поставь телефон между вами и нажми «Слушать».</p>
        </section>

        <section class="card archive" aria-labelledby="archive-title">
          <div class="card-head">
            <h2 id="archive-title">Накоплено</h2>
            <p id="count" class="count"></p>
          </div>
          <div id="history" class="history"></div>
          <p id="empty" class="empty">Уже сказанное появится здесь.</p>
        </section>
      </div>

      <footer class="dock">
        <button id="flip" class="flip" type="button" aria-pressed="false">Микрофон к собеседнику</button>
        <button id="stop" class="stop" type="button" hidden>Стоп</button>
        <div id="idle-actions" class="actions">
          <button id="start" class="primary" type="button">Слушать</button>
          <p class="hint">Нижним торцом к говорящему. Пока отвечаешь — нажми «Я говорю».</p>
        </div>
        <div id="live-actions" class="modes" hidden>
          <button id="mode-listen" class="mode" type="button" data-mode="listen">Слушаю</button>
          <button id="mode-speak" class="mode" type="button" data-mode="speak">Я говорю</button>
        </div>
      </footer>

      <div id="settings" class="settings" hidden>
        <div class="settings-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <div class="settings-head">
            <h2 id="settings-title">Настройки</h2>
            <button id="settings-close" class="settings-close" type="button">Закрыть</button>
          </div>
          <section class="settings-block">
            <h3>Режим</h3>
            <div class="mode-switch" role="group" aria-label="Режим">
              <button id="mode-translate" class="choice" type="button">Перевод</button>
              <button id="mode-text" class="choice" type="button">Текст</button>
            </div>
          </section>
          <section class="settings-block">
            <h3>Ключ OpenAI</h3>
            <input id="api-key" class="key-input" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk-..." />
            <p id="key-state" class="key-state"></p>
            <div class="mode-switch">
              <button id="key-save" class="choice" type="button">Сохранить</button>
              <button id="key-clear" class="choice" type="button">Стереть</button>
            </div>
          </section>
          <section class="settings-block">
            <h3>Микрофон</h3>
            <div class="mode-switch" role="group" aria-label="Микрофон">
              <button id="noise-far" class="choice" type="button">Далеко</button>
              <button id="noise-near" class="choice" type="button">Близко</button>
            </div>
          </section>
        </div>
      </div>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
